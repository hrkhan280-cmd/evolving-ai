<!DOCTYPE html>
<html lang="en">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--sf:#f0f4f9;--sf2:#e3e8ef;--tx:#1f1f1f;--mu:#5f6368;--ac:#0b57d0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131314;--sf:#1e1f20;--sf2:#2d2f31;--tx:#e3e3e3;--mu:#9aa0a6;--ac:#a8c7fa}}
:root[data-theme="dark"]{--bg:#131314;--sf:#1e1f20;--sf2:#2d2f31;--tx:#e3e3e3;--mu:#9aa0a6;--ac:#a8c7fa}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 "Google Sans",Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.ib{width:40px;height:40px;border-radius:50%;font-size:20px}
.ib:active{background:var(--sf2)}
.ttl{font-size:20px;font-weight:500}
.grad{background:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);-webkit-background-clip:text;background-clip:text;color:transparent}
#main{flex:1;overflow-y:auto;padding:0 16px 8px}
#hero{margin-top:12vh}
#hero h2{font-size:34px;line-height:1.2;margin:0 0 6px;font-weight:500}
#hero p{font-size:30px;margin:0;color:var(--sf2);font-weight:500}
.chips{display:flex;flex-direction:column;gap:10px;margin-top:36px}
.chip{background:var(--sf);border-radius:16px;padding:14px 16px;text-align:left}
.u{background:var(--sf);border-radius:20px 20px 4px 20px;padding:10px 16px;margin:14px 0 14px auto;width:fit-content;max-width:85%}
.b{display:flex;gap:12px;margin:14px 0}
.sp{flex:none;font-size:22px;line-height:1.3}
.bt{flex:1;min-width:0;white-space:pre-wrap;word-wrap:break-word}
.act{display:flex;gap:2px;margin-top:6px}
.act button{width:34px;height:34px;border-radius:50%;font-size:16px;opacity:.7}
.act button:active{background:var(--sf2)}
.tc{display:flex;gap:6px;margin-top:8px}
.tc input{flex:1;min-width:0}
.sys{text-align:center;color:var(--mu);font-size:13px;margin:10px 0}
.bar{padding:8px 12px 12px}
.pill{display:flex;align-items:center;gap:6px;background:var(--sf);border-radius:28px;padding:6px 6px 6px 6px}
input{font:inherit;color:var(--tx);background:none;border:0;outline:0;flex:1;min-width:0;padding:8px 0}
.tc input{background:var(--sf);border-radius:12px;padding:8px 12px}
.send{background:var(--ac);color:var(--bg);width:40px;height:40px;border-radius:50%;font-size:18px}
.note{text-align:center;font-size:11px;color:var(--mu);margin-top:6px}
#dr{position:fixed;inset:0;display:none;background:rgba(0,0,0,.4);z-index:5}
#pn{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:340px;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;font-size:14px}
#pn h3{margin:18px 0 6px;font-size:13px;color:var(--mu);font-weight:500;text-transform:uppercase}
.btn{display:block;width:100%;background:var(--sf);border-radius:20px;padding:10px 14px;margin:6px 0;text-align:left}
.pg{height:6px;background:var(--sf2);border-radius:3px;margin:6px 0;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--ac)}
.pill .ib{flex:none;width:36px;height:36px;font-size:22px;color:var(--mu)}
</style>

<body>
<div class="top">
 <button class="ib" id="mn" aria-label="Menu">☰</button>
 <div class="ttl grad">Evolving AI</div>
 <button class="ib" id="nw" aria-label="New chat">✏️</button>
</div>
<div id="main">
 <div id="hero">
  <h2 class="grad">Hello there</h2>
  <p>How can I help today?</p>
  <div class="chips">
   <button class="chip" data-t="hello">👋 Say hello</button>
   <button class="chip" data-t="what can you do">✨ What can you do?</button>
   <button class="chip" data-t="how are you">💬 How are you?</button>
  </div>
 </div>
 <div id="msgs"></div>
</div>
<div class="bar">
 <div class="pill"><button class="ib" id="at" aria-label="Add book">＋</button><input id="in" placeholder="Ask Evolving AI or your books" autocomplete="off"><button class="send" id="sd" aria-label="Send">➤</button></div>
 <div class="note" id="mode">Local learning mode · works offline</div>
</div>
<div id="dr"><div id="pn">
 <div class="ttl grad">Evolving AI</div>
 <h3>Model</h3><div id="stat"></div>
 <button class="btn" id="rt">🔁 Retrain now</button>
 <h3>Library</h3><div id="bk" style="color:var(--mu)"></div>
 <button class="btn" id="ab">📚 Add book (PDF, Word, Excel, TXT)</button><input type="file" id="fi" hidden multiple accept=".pdf,.docx,.xlsx,.xls,.csv,.txt,.md">
 <h3>On-device LLM</h3>
 <div id="ls" style="color:var(--mu)">Optional. Downloads a small model once (~700 MB), then runs on your phone. Needs WebGPU.</div>
 <div class="pg"><i id="pb"></i></div>
 <button class="btn" id="ld">⬇️ Load LLM</button>
 <h3>History</h3><div id="hs" style="color:var(--mu)"></div>
 <button class="btn" id="rs" style="margin-top:20px">🗑 Reset all learning</button>
</div></div>
<script>
const KEY='evolving-ai-v1';
const seed=()=>({entries:[
 {id:1,p:'hello hi hey',a:'Hey! Teach me things. Rate my replies and I will improve.',q:0,n:0},
 {id:2,p:'how are you',a:"I'm learning every minute. How about you?",q:0,n:0},
 {id:3,p:'your name who are you',a:"I'm Evolving AI, a self-improving assistant that lives on your phone.",q:0,n:0},
 {id:4,p:'help what can you do',a:'I chat, learn from 👍/👎, and retrain myself every few ratings.',q:0,n:0}],
 theta:{s:1,q:0.6,eps:0.15,alpha:0.3},hist:[{v:1,note:'initial model'}],replay:[],since:0,nextId:5});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
// ---- learning engine (bandit + replay-evaluated retraining) ----
const tok=t=>new Set(t.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>1));
const sim=(a,b)=>{const A=tok(a),B=tok(b);let i=0;A.forEach(w=>B.has(w)&&i++);return i?i/(A.size+B.size-i):0};
const rank=(m,th)=>S.entries.map(e=>({e,sc:sim(m,e.p)>0?th.s*sim(m,e.p)+th.q*e.q:-9})).sort((a,b)=>b.sc-a.sc);
function pick(m){const r=rank(m,S.theta).filter(x=>x.sc>-9);if(!r.length)return null;
 return r[Math.random()<S.theta.eps?Math.floor(Math.random()*Math.min(3,r.length)):0].e}
const evalT=th=>{if(!S.replay.length)return 0;let h=0;
 S.replay.forEach(x=>{const t=rank(x.m,th)[0];if(t&&t.sc>-9)x.r>0?(t.e.id===x.id&&h++):(t.e.id!==x.id&&h++)});return h/S.replay.length};
function retrain(){
 if(S.replay.length<4){note('Rate at least 4 replies before retraining.');return}
 const base=evalT(S.theta),j=(v,lo,hi,d)=>Math.min(hi,Math.max(lo,v+(Math.random()-.5)*d));let best=null,bs=base;
 for(let i=0;i<30;i++){const c={s:j(S.theta.s,.2,2,.6),q:j(S.theta.q,0,2,.6),eps:j(S.theta.eps,.02,.4,.1),alpha:j(S.theta.alpha,.05,.7,.2)};
  const sc=evalT(c);if(sc>bs+.001){bs=sc;best=c}}
 if(best){S.theta=best;S.hist.push({v:S.hist.length+1,note:'accepted '+(base*100|0)+'% → '+(bs*100|0)+'%'});note('🔁 New version accepted ('+(base*100|0)+'% → '+(bs*100|0)+'%)')}
 else{S.hist.push({v:'—',note:'no challenger won, kept current'});note('🔁 Retrained: current model kept.')}
 S.since=0;save();panel()}
// ---- optional on-device LLM (WebLLM) ----
let llm=null;const chatLog=[];
async function loadLLM(){
 const ls=$('ls');
 if(!navigator.gpu){ls.textContent='❌ This browser has no WebGPU. Use Chrome (Android, updated) or Safari on iOS 26+. Local mode still works.';return}
 ls.textContent='Checking your GPU…';
 let ad;try{ad=await navigator.gpu.requestAdapter()}catch(e){}
 if(!ad){ls.textContent='❌ No usable GPU found by the browser. Local mode still works.';return}
 const f16=ad.features&&ad.features.has('shader-f16');
 const list=(f16?['Llama-3.2-1B-Instruct-q4f16_1-MLC']:[]).concat(['Llama-3.2-1B-Instruct-q4f32_1-MLC','SmolLM2-360M-Instruct-q4f32_1-MLC']);
 let w;try{w=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm')}
 catch(e){ls.textContent='❌ Could not load the WebLLM library (internet or blocked CDN): '+(e.message||e);return}
 for(const m of list){
  try{
   ls.textContent='Downloading '+m+'…';
   llm=await w.CreateMLCEngine(m,{initProgressCallback:p=>{$('pb').style.width=(p.progress*100)+'%';ls.textContent=p.text}});
   ls.textContent='✅ LLM ready: '+m;$('mode').textContent='On-device LLM + learning · offline after first load';return
  }catch(e){llm=null;ls.textContent='⚠️ '+m+' failed: '+(e.message||e)+' Trying a smaller one…';await new Promise(r=>setTimeout(r,2500))}
 }
 ls.textContent+=' ❌ All models failed. Check free storage (~1 GB), close other apps, and retry on Wi-Fi.'}
async function llmReply(t){
 const liked=S.entries.filter(e=>e.q>0.2).sort((a,b)=>b.q-a.q).slice(0,5).map(e=>'- When asked about "'+e.p+'", the user liked: '+e.a).join('\n');
 const msgs=[{role:'system',content:'You are Evolving AI, a concise, friendly assistant on a phone. Learn the user\'s preferences from these liked replies:\n'+(liked||'(none yet)')},...chatLog.slice(-6),{role:'user',content:t}];
 const r=await llm.chat.completions.create({messages:msgs,max_tokens:300});return r.choices[0].message.content}
// ---- UI ----
const msgs$=$('msgs'),main=$('main');
function scroll(){main.scrollTop=main.scrollHeight}
function note(t){$('hero').style.display='none';const d=document.createElement('div');d.className='sys';d.textContent=t;msgs$.appendChild(d);scroll();return d}
function user(t){$('hero').style.display='none';const d=document.createElement('div');d.className='u';d.textContent=t;msgs$.appendChild(d);scroll()}
function bot(text,m,id){
 const row=document.createElement('div');row.className='b';
 row.innerHTML='<div class="sp grad">✦</div><div class="bt"></div>';
 const bt=row.querySelector('.bt');bt.textContent=text;
 const act=document.createElement('div');act.className='act';
 const mk=(ic,fn)=>{const b=document.createElement('button');b.textContent=ic;b.onclick=fn;act.appendChild(b)};
 mk('👍',()=>rate(id,m,text,1,act));mk('👎',()=>rate(id,m,text,-1,act,bt));
 mk('📋',()=>{try{navigator.clipboard.writeText(text)}catch(e){}});
 bt.appendChild(act);msgs$.appendChild(row);scroll();return bt}
function rate(id,m,text,r,act,bt){
 act.remove();
 if(id==null){ // LLM reply: distil good ones into local memory
  if(r>0){id=S.nextId++;S.entries.push({id,p:m,a:text,q:.5,n:1});S.replay.push({m,id,r:1});note('Saved to memory 🧠')}
 }else{const e=S.entries.find(x=>x.id===id);if(e){e.q+=S.theta.alpha*(r-e.q);e.n++}S.replay.push({m,id,r})}
 if(S.replay.length>200)S.replay.shift();S.since++;
 if(r<0)teach(m,bt);
 save();panel();if(S.since>=5)retrain()}
function teach(m,bt){
 const d=document.createElement('div');d.className='tc';
 d.innerHTML='<input placeholder="What should I have said?"><button class="send" style="width:36px;height:36px">✓</button>';
 const i=d.querySelector('input');
 d.querySelector('button').onclick=()=>{const v=i.value.trim();if(!v)return;
  const id=S.nextId++;S.entries.push({id,p:m,a:v,q:.5,n:1});S.replay.push({m,id,r:1});save();d.remove();note('Learned! 🧠');panel()};
 bt.appendChild(d);i.focus()}
async function send(t){
 t=t.trim();if(!t)return;$('in').value='';user(t);
 if(await bookCmd(t))return;
 let id=null,out;
 if(llm){try{out=await llmReply(t);chatLog.push({role:'user',content:t},{role:'assistant',content:out})}catch(e){out=null}}
 if(out==null){const e=pick(t);if(e){out=e.a;id=e.id}else{const b=bot("I don't know that yet. Tap 👎 or teach me below.",t,null);teach(t,b);return}}
 bot(out,t,id)}
function panel(){renderBooks();
 $('stat').innerHTML=S.entries.length+' skills · '+S.replay.length+' ratings<br>fit score: '+(S.replay.length?(evalT(S.theta)*100|0)+'%':'n/a')+'<br>'+Object.entries(S.theta).map(([k,v])=>k+' '+v.toFixed(2)).join(' · ');
 $('hs').innerHTML=S.hist.slice().reverse().slice(0,8).map(h=>'v'+h.v+': '+h.note).join('<br>')}
// ---- Library: add books (PDF / Word / Excel / CSV / TXT), summarise, answer from them ----
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',MAM='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',XLS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const loaded={};const lib=u=>loaded[u]||(loaded[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.crossOrigin='anonymous';s.onload=ok;s.onerror=()=>{delete loaded[u];no(new Error('Could not load the file reader (needs internet the first time)'))};document.head.appendChild(s)}));
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('eai-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('b',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const bAll=async()=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('b').objectStore('b').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>ok([])})}catch(e){return[]}};
const bPut=async r=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('b','readwrite');t.objectStore('b').put(r);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const bDel=async id=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('b','readwrite');t.objectStore('b').delete(id);t.oncomplete=ok})};
let pdfReady=0;
async function extract(f,cb){
 const n=f.name.toLowerCase();
 if(/\.(txt|md|csv)$/.test(n))return f.text();
 if(n.endsWith('.pdf')){
  await lib(PDFJS);
  if(!pdfReady){const w=await(await fetch(PDFW)).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));pdfReady=1}
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let t='';
  for(let i=1;i<=doc.numPages;i++){const c=await(await doc.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n\n';cb(i/doc.numPages)}
  return t}
 if(n.endsWith('.docx')){await lib(MAM);return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
 if(/\.xlsx?$/.test(n)){await lib(XLS);const wb=XLSX.read(await f.arrayBuffer());return wb.SheetNames.map(s=>'Sheet '+s+':\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n\n')}
 throw new Error('Unsupported type. Use PDF, DOCX, XLSX, CSV, TXT or MD (old .doc: save as .docx first).')}
const SPLIT=/(?<=[.!?])\s+|\n+/;
function chunk(t){const o=[];let c='';for(const s of t.split(SPLIT)){if(c.length+s.length>1200&&c){o.push(c);c=''}c+=s+' '}if(c.trim())o.push(c);return o}
const STOP=new Set('about above after again also because been before being between both could does each from have here into just like make many more most much only other over said same some such than that their them then there these they this those through under very were what when where which while will with would your'.split(' '));
const W=s=>[...new Set((s.toLowerCase().match(/[a-z0-9]{4,}/g)||[]).filter(w=>!STOP.has(w)))];
function extSum(t,n){ // offline extractive summary: top sentences by word frequency, in reading order
 const ss=t.split(SPLIT).map(s=>s.trim()).filter(s=>s.length>40&&s.length<400);
 if(ss.length<=n)return ss.map(s=>'• '+s).join('\n')||t.slice(0,600);
 const f={};ss.forEach(s=>W(s).forEach(w=>f[w]=(f[w]||0)+1));
 return ss.map((s,i)=>{const w=W(s);return{i,s,v:w.reduce((a,x)=>a+f[x],0)/(w.length+5)}}).sort((a,b)=>b.v-a.v).slice(0,n).sort((a,b)=>a.i-b.i).map(x=>'• '+x.s).join('\n')}
const ext=r=>r.kind==='sheet'?r.text.split('\n').slice(0,14).join('\n'):extSum(r.text,8);
const ask=async c=>(await llm.chat.completions.create({messages:[{role:'user',content:c}],max_tokens:300})).choices[0].message.content;
async function llmSum(r,n){
 const cs=r.chunks,step=Math.ceil(cs.length/8),g=[];
 for(let i=0;i<cs.length;i+=step)g.push(cs.slice(i,i+step).join(' ').slice(0,3500));
 const p=[];for(let i=0;i<g.length;i++){n.textContent='Reading part '+(i+1)+' of '+g.length+'…';p.push(await ask('Summarize this passage in 2-3 sentences:\n'+g[i]))}
 n.textContent='Writing final summary…';
 return ask('Combine these notes into a clear summary of "'+r.name+'": a short overview, then 5 key points.\n\n'+p.join('\n'))}
async function summarize(r){
 const n=note('Summarizing “'+r.name+'”…'),k=llm?'l':'e';
 r.summary=r.summary||{};let out=r.summary[k];
 if(!out){try{out=llm?await llmSum(r,n):ext(r)}catch(e){out=ext(r)}r.summary[k]=out;try{await bPut(r)}catch(e){}}
 n.remove();bot('📖 '+r.name+'\n\n'+out,'summarize '+r.name,null)}
async function bookCmd(t){
 const bs=await bAll();if(!bs.length)return false;
 const m=/^\s*summari[sz]e\b(.*)$/i.exec(t);
 if(m){const q=m[1].toLowerCase();await summarize(bs.find(b=>q&&q.includes(b.name.toLowerCase().replace(/\.[a-z0-9]+$/,'')))||bs[bs.length-1]);return true}
 const qw=W(t);if(qw.length<2)return false;
 const sc=[];bs.forEach(b=>b.chunks.forEach(c=>{const cw=new Set(W(c));const h=qw.filter(w=>cw.has(w)).length;if(h>=2)sc.push({c,h,b:b.name})}));
 if(!sc.length)return false;
 sc.sort((a,b)=>b.h-a.h);const top=sc.slice(0,3),src=[...new Set(top.map(x=>x.b))].join(', ');let out;
 if(llm){try{out=(await llm.chat.completions.create({messages:[{role:'system',content:'Answer using only these book excerpts. If they do not contain the answer, say so briefly.\n\n'+top.map(x=>x.c).join('\n---\n')},{role:'user',content:t}],max_tokens:300})).choices[0].message.content}catch(e){}}
 if(!out){const ss=top[0].c.split(SPLIT).map(s=>({s,v:qw.filter(w=>s.toLowerCase().includes(w)).length}));out=ss.map((x,i)=>({...x,i})).sort((a,b)=>b.v-a.v).slice(0,2).sort((a,b)=>a.i-b.i).map(x=>x.s).join(' ').trim()||top[0].c.slice(0,300)}
 bot(out+'\n\n📖 From: '+src,t,null);return true}
async function addFiles(fs){
 for(const f of fs){const n=note('Reading '+f.name+'…');
  try{const text=(await extract(f,p=>n.textContent='Reading '+f.name+' '+(p*100|0)+'%')).replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n\n').trim();
   if(text.length<30)throw new Error('no readable text (scanned PDF?)');
   await bPut({id:'b'+Date.now()+Math.floor(Math.random()*1e4),name:f.name,kind:/\.(xlsx?|csv)$/i.test(f.name)?'sheet':'text',text,chunks:chunk(text),added:Date.now()});
   n.textContent='📚 Added '+f.name+' ('+Math.round(text.length/1000)+'k chars). Ask me about it, or type "summarize".'}
  catch(e){n.textContent='❌ '+f.name+': '+(e.message||e)}}
 renderBooks()}
async function renderBooks(){
 const bs=await bAll(),el=$('bk');el.innerHTML='';
 if(!bs.length){el.textContent='No books yet.';return}
 bs.forEach(b=>{const r=document.createElement('div');r.style.cssText='display:flex;align-items:center;gap:4px;margin:4px 0';
  const nm=document.createElement('div');nm.style.cssText='flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)';nm.textContent=b.name;
  const s=document.createElement('button');s.textContent='Summarize';s.className='btn';s.style.cssText='width:auto;margin:0;padding:6px 10px';s.onclick=()=>{$('dr').style.display='none';summarize(b)};
  const x=document.createElement('button');x.textContent='✕';x.className='ib';x.onclick=async()=>{await bDel(b.id);renderBooks()};
  r.append(nm,s,x);el.appendChild(r)})}
$('ab').onclick=$('at').onclick=()=>$('fi').click();
$('fi').onchange=e=>{$('dr').style.display='none';addFiles([...e.target.files]);e.target.value=''};
$('sd').onclick=()=>send($('in').value);
$('in').onkeydown=e=>{if(e.key==='Enter')send($('in').value)};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.dataset.t));
$('mn').onclick=()=>{panel();$('dr').style.display='block'};
$('dr').onclick=e=>{if(e.target.id==='dr')$('dr').style.display='none'};
$('rt').onclick=retrain;$('ld').onclick=loadLLM;
$('nw').onclick=()=>{msgs$.innerHTML='';$('hero').style.display='block';chatLog.length=0};
$('rs').onclick=()=>{if(confirm('Wipe all learning?')){S=seed();save();msgs$.innerHTML='';$('hero').style.display='block';panel()}};
panel();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
