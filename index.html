<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolving AI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131314">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evolving AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--sf:#f0f4f9;--sf2:#e3e8ef;--tx:#1f1f1f;--mu:#5f6368;--ac:#0b57d0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131314;--sf:#1e1f20;--sf2:#2d2f31;--tx:#e3e3e3;--mu:#9aa0a6;--ac:#a8c7fa}}
:root[data-theme="dark"]{--bg:#131314;--sf:#1e1f20;--sf2:#2d2f31;--tx:#e3e3e3;--mu:#9aa0a6;--ac:#a8c7fa}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 "Google Sans",Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.ib{width:40px;height:40px;border-radius:50%;font-size:20px}
.ib:active{background:var(--sf2)}
.ttl{font-size:20px;font-weight:500}
.grad{background:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);-webkit-background-clip:text;background-clip:text;color:transparent}
#main{flex:1;overflow-y:auto;padding:0 16px 8px}
#hero{margin-top:12vh}
#hero h2{font-size:34px;line-height:1.2;margin:0 0 6px;font-weight:500}
#hero p{font-size:30px;margin:0;color:var(--sf2);font-weight:500}
.chips{display:flex;flex-direction:column;gap:10px;margin-top:36px}
.chip{background:var(--sf);border-radius:16px;padding:14px 16px;text-align:left}
.u{background:var(--sf);border-radius:20px 20px 4px 20px;padding:10px 16px;margin:14px 0 14px auto;width:fit-content;max-width:85%}
.b{display:flex;gap:12px;margin:14px 0}
.sp{flex:none;font-size:22px;line-height:1.3}
.bt{flex:1;min-width:0;white-space:pre-wrap;word-wrap:break-word}
.act{display:flex;gap:2px;margin-top:6px}
.act button{width:34px;height:34px;border-radius:50%;font-size:16px;opacity:.7}
.act button:active{background:var(--sf2)}
.tc{display:flex;gap:6px;margin-top:8px}
.tc input{flex:1;min-width:0}
.sys{text-align:center;color:var(--mu);font-size:13px;margin:10px 0}
.bar{padding:8px 12px 12px}
.pill{display:flex;align-items:center;gap:6px;background:var(--sf);border-radius:28px;padding:6px 6px 6px 18px}
input{font:inherit;color:var(--tx);background:none;border:0;outline:0;flex:1;min-width:0;padding:8px 0}
.tc input{background:var(--sf);border-radius:12px;padding:8px 12px}
.send{background:var(--ac);color:var(--bg);width:40px;height:40px;border-radius:50%;font-size:18px}
.note{text-align:center;font-size:11px;color:var(--mu);margin-top:6px}
#dr{position:fixed;inset:0;display:none;background:rgba(0,0,0,.4);z-index:5}
#pn{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:340px;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;font-size:14px}
#pn h3{margin:18px 0 6px;font-size:13px;color:var(--mu);font-weight:500;text-transform:uppercase}
.btn{display:block;width:100%;background:var(--sf);border-radius:20px;padding:10px 14px;margin:6px 0;text-align:left}
.pg{height:6px;background:var(--sf2);border-radius:3px;margin:6px 0;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--ac)}
</style>
</head>
<body>
<div class="top">
 <button class="ib" id="mn" aria-label="Menu">☰</button>
 <div class="ttl grad">Evolving AI</div>
 <button class="ib" id="nw" aria-label="New chat">✏️</button>
</div>
<div id="main">
 <div id="hero">
  <h2 class="grad">Hello there</h2>
  <p>How can I help today?</p>
  <div class="chips">
   <button class="chip" data-t="hello">👋 Say hello</button>
   <button class="chip" data-t="what can you do">✨ What can you do?</button>
   <button class="chip" data-t="how are you">💬 How are you?</button>
  </div>
 </div>
 <div id="msgs"></div>
</div>
<div class="bar">
 <div class="pill"><input id="in" placeholder="Ask Evolving AI" autocomplete="off"><button class="send" id="sd" aria-label="Send">➤</button></div>
 <div class="note" id="mode">Local learning mode · works offline</div>
</div>
<div id="dr"><div id="pn">
 <div class="ttl grad">Evolving AI</div>
 <h3>Model</h3><div id="stat"></div>
 <button class="btn" id="rt">🔁 Retrain now</button>
 <h3>On-device LLM</h3>
 <div id="ls" style="color:var(--mu)">Optional. Downloads a small model once (~700 MB), then runs on your phone. Needs WebGPU.</div>
 <div class="pg"><i id="pb"></i></div>
 <button class="btn" id="ld">⬇️ Load LLM</button>
 <h3>History</h3><div id="hs" style="color:var(--mu)"></div>
 <button class="btn" id="rs" style="margin-top:20px">🗑 Reset all learning</button>
</div></div>
<script>
const KEY='evolving-ai-v1';
const seed=()=>({entries:[
 {id:1,p:'hello hi hey',a:'Hey! Teach me things. Rate my replies and I will improve.',q:0,n:0},
 {id:2,p:'how are you',a:"I'm learning every minute. How about you?",q:0,n:0},
 {id:3,p:'your name who are you',a:"I'm Evolving AI, a self-improving assistant that lives on your phone.",q:0,n:0},
 {id:4,p:'help what can you do',a:'I chat, learn from 👍/👎, and retrain myself every few ratings.',q:0,n:0}],
 theta:{s:1,q:0.6,eps:0.15,alpha:0.3},hist:[{v:1,note:'initial model'}],replay:[],since:0,nextId:5});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
// ---- learning engine (bandit + replay-evaluated retraining) ----
const tok=t=>new Set(t.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>1));
const sim=(a,b)=>{const A=tok(a),B=tok(b);let i=0;A.forEach(w=>B.has(w)&&i++);return i?i/(A.size+B.size-i):0};
const rank=(m,th)=>S.entries.map(e=>({e,sc:sim(m,e.p)>0?th.s*sim(m,e.p)+th.q*e.q:-9})).sort((a,b)=>b.sc-a.sc);
function pick(m){const r=rank(m,S.theta).filter(x=>x.sc>-9);if(!r.length)return null;
 return r[Math.random()<S.theta.eps?Math.floor(Math.random()*Math.min(3,r.length)):0].e}
const evalT=th=>{if(!S.replay.length)return 0;let h=0;
 S.replay.forEach(x=>{const t=rank(x.m,th)[0];if(t&&t.sc>-9)x.r>0?(t.e.id===x.id&&h++):(t.e.id!==x.id&&h++)});return h/S.replay.length};
function retrain(){
 if(S.replay.length<4){note('Rate at least 4 replies before retraining.');return}
 const base=evalT(S.theta),j=(v,lo,hi,d)=>Math.min(hi,Math.max(lo,v+(Math.random()-.5)*d));let best=null,bs=base;
 for(let i=0;i<30;i++){const c={s:j(S.theta.s,.2,2,.6),q:j(S.theta.q,0,2,.6),eps:j(S.theta.eps,.02,.4,.1),alpha:j(S.theta.alpha,.05,.7,.2)};
  const sc=evalT(c);if(sc>bs+.001){bs=sc;best=c}}
 if(best){S.theta=best;S.hist.push({v:S.hist.length+1,note:'accepted '+(base*100|0)+'% → '+(bs*100|0)+'%'});note('🔁 New version accepted ('+(base*100|0)+'% → '+(bs*100|0)+'%)')}
 else{S.hist.push({v:'—',note:'no challenger won, kept current'});note('🔁 Retrained: current model kept.')}
 S.since=0;save();panel()}
// ---- optional on-device LLM (WebLLM) ----
let llm=null;const chatLog=[];
async function loadLLM(){
 $('ls').textContent='Loading… keep this screen open.';
 try{
  const w=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm');
  llm=await w.CreateMLCEngine('Llama-3.2-1B-Instruct-q4f16_1-MLC',{initProgressCallback:p=>{$('pb').style.width=(p.progress*100)+'%';$('ls').textContent=p.text}});
  $('ls').textContent='✅ LLM ready (cached for offline use).';$('mode').textContent='On-device LLM + learning · offline after first load';
 }catch(e){llm=null;$('ls').textContent='❌ Could not load (needs WebGPU and internet once; some hosts block the download). Local mode still works.'}}
async function llmReply(t){
 const liked=S.entries.filter(e=>e.q>0.2).sort((a,b)=>b.q-a.q).slice(0,5).map(e=>'- When asked about "'+e.p+'", the user liked: '+e.a).join('\n');
 const msgs=[{role:'system',content:'You are Evolving AI, a concise, friendly assistant on a phone. Learn the user\'s preferences from these liked replies:\n'+(liked||'(none yet)')},...chatLog.slice(-6),{role:'user',content:t}];
 const r=await llm.chat.completions.create({messages:msgs,max_tokens:300});return r.choices[0].message.content}
// ---- UI ----
const msgs$=$('msgs'),main=$('main');
function scroll(){main.scrollTop=main.scrollHeight}
function note(t){const d=document.createElement('div');d.className='sys';d.textContent=t;msgs$.appendChild(d);scroll()}
function user(t){$('hero').style.display='none';const d=document.createElement('div');d.className='u';d.textContent=t;msgs$.appendChild(d);scroll()}
function bot(text,m,id){
 const row=document.createElement('div');row.className='b';
 row.innerHTML='<div class="sp grad">✦</div><div class="bt"></div>';
 const bt=row.querySelector('.bt');bt.textContent=text;
 const act=document.createElement('div');act.className='act';
 const mk=(ic,fn)=>{const b=document.createElement('button');b.textContent=ic;b.onclick=fn;act.appendChild(b)};
 mk('👍',()=>rate(id,m,text,1,act));mk('👎',()=>rate(id,m,text,-1,act,bt));
 mk('📋',()=>{try{navigator.clipboard.writeText(text)}catch(e){}});
 bt.appendChild(act);msgs$.appendChild(row);scroll();return bt}
function rate(id,m,text,r,act,bt){
 act.remove();
 if(id==null){ // LLM reply: distil good ones into local memory
  if(r>0){id=S.nextId++;S.entries.push({id,p:m,a:text,q:.5,n:1});S.replay.push({m,id,r:1});note('Saved to memory 🧠')}
 }else{const e=S.entries.find(x=>x.id===id);if(e){e.q+=S.theta.alpha*(r-e.q);e.n++}S.replay.push({m,id,r})}
 if(S.replay.length>200)S.replay.shift();S.since++;
 if(r<0)teach(m,bt);
 save();panel();if(S.since>=5)retrain()}
function teach(m,bt){
 const d=document.createElement('div');d.className='tc';
 d.innerHTML='<input placeholder="What should I have said?"><button class="send" style="width:36px;height:36px">✓</button>';
 const i=d.querySelector('input');
 d.querySelector('button').onclick=()=>{const v=i.value.trim();if(!v)return;
  const id=S.nextId++;S.entries.push({id,p:m,a:v,q:.5,n:1});S.replay.push({m,id,r:1});save();d.remove();note('Learned! 🧠');panel()};
 bt.appendChild(d);i.focus()}
async function send(t){
 t=t.trim();if(!t)return;$('in').value='';user(t);
 let id=null,out;
 if(llm){try{out=await llmReply(t);chatLog.push({role:'user',content:t},{role:'assistant',content:out})}catch(e){out=null}}
 if(out==null){const e=pick(t);if(e){out=e.a;id=e.id}else{const b=bot("I don't know that yet. Tap 👎 or teach me below.",t,null);teach(t,b);return}}
 bot(out,t,id)}
function panel(){
 $('stat').innerHTML=S.entries.length+' skills · '+S.replay.length+' ratings<br>fit score: '+(S.replay.length?(evalT(S.theta)*100|0)+'%':'n/a')+'<br>'+Object.entries(S.theta).map(([k,v])=>k+' '+v.toFixed(2)).join(' · ');
 $('hs').innerHTML=S.hist.slice().reverse().slice(0,8).map(h=>'v'+h.v+': '+h.note).join('<br>')}
$('sd').onclick=()=>send($('in').value);
$('in').onkeydown=e=>{if(e.key==='Enter')send($('in').value)};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.dataset.t));
$('mn').onclick=()=>{panel();$('dr').style.display='block'};
$('dr').onclick=e=>{if(e.target.id==='dr')$('dr').style.display='none'};
$('rt').onclick=retrain;$('ld').onclick=loadLLM;
$('nw').onclick=()=>{msgs$.innerHTML='';$('hero').style.display='block';chatLog.length=0};
$('rs').onclick=()=>{if(confirm('Wipe all learning?')){S=seed();save();msgs$.innerHTML='';$('hero').style.display='block';panel()}};
panel();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
